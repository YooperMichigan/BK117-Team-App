# BK117 Team App: meeting list with Upcoming / Past tabs, an Actions drop-down per meeting,
# and minutes emailed when a meeting is marked complete.
# Before pasting:
#   - Check Pilots list has an Email column (Single line of text) filled in for each pilot
#   - Office 365 Outlook is added under Data
#   - App.OnStart is the version in 1-App-OnStart.txt (sets varShowPast)
# Then on MeetingsScreen delete lblMeetings, galMeetings and btnNewMeeting,
# right-click MeetingsScreen, Paste code.
- btnNewMeeting:
    Control: Classic/Button
    Properties:
      Text: ="+ New meeting"
      X: =1180
      Y: =444
      Width: =154
      Height: =40
      Size: =11
      FontWeight: =FontWeight.Bold
      Fill: =Color.White
      HoverFill: =RGBA(251, 227, 212, 1)
      Color: =RGBA(180, 72, 15, 1)
      HoverColor: =RGBA(180, 72, 15, 1)
      BorderColor: =RGBA(232, 105, 31, 1)
      BorderThickness: =2
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      OnSelect: =Set(varEditMeeting, false); Set(varShowPast, false); Navigate(NewMeetingScreen)
- btnShowUpcoming:
    Control: Classic/Button
    Properties:
      Text: ="Upcoming"
      X: =990
      Y: =444
      Width: =92
      Height: =40
      Size: =11
      FontWeight: =FontWeight.Bold
      Fill: =If(varShowPast, Color.White, RGBA(14, 34, 64, 1))
      HoverFill: =If(varShowPast, RGBA(243, 242, 239, 1), RGBA(14, 34, 64, 1))
      Color: =If(varShowPast, RGBA(14, 34, 64, 1), Color.White)
      HoverColor: =If(varShowPast, RGBA(14, 34, 64, 1), Color.White)
      BorderColor: =RGBA(14, 34, 64, 1)
      BorderThickness: =2
      RadiusTopLeft: =10
      RadiusTopRight: =0
      RadiusBottomLeft: =10
      RadiusBottomRight: =0
      OnSelect: =Set(varShowPast, false); Set(varArmed, Blank())
- btnShowPast:
    Control: Classic/Button
    Properties:
      Text: ="Past"
      X: =1080
      Y: =444
      Width: =86
      Height: =40
      Size: =11
      FontWeight: =FontWeight.Bold
      Fill: =If(varShowPast, RGBA(14, 34, 64, 1), Color.White)
      HoverFill: =If(varShowPast, RGBA(14, 34, 64, 1), RGBA(243, 242, 239, 1))
      Color: =If(varShowPast, Color.White, RGBA(14, 34, 64, 1))
      HoverColor: =If(varShowPast, Color.White, RGBA(14, 34, 64, 1))
      BorderColor: =RGBA(14, 34, 64, 1)
      BorderThickness: =2
      RadiusTopLeft: =0
      RadiusTopRight: =10
      RadiusBottomLeft: =0
      RadiusBottomRight: =10
      OnSelect: =Set(varShowPast, true); Set(varArmed, Blank())
- btnSendMinutes:
    Control: Classic/Button
    Properties:
      Visible: =false
      Text: ="Send minutes"
      X: =990
      Y: =748
      Width: =100
      Height: =10
      OnSelect: |-
        =With(
            {
                m: LookUp(Meetings, ID = varMailMeeting.ID),
                items: Sort(Filter(AgendaItems, MeetingID = varMailMeeting.ID), Position, SortOrder.Ascending),
                st: Value(Left(varMailMeeting.StartTime, 2)) * 60 + Value(Right(varMailMeeting.StartTime, 2)),
                sendTo: Concat(Filter('Check Pilots', !IsBlank(Email)), Email, ";")
            },
            IfError(
                Office365Outlook.SendEmailV2(
                    If(IsBlank(sendTo), User().Email, sendTo),
                    "BK117 meeting minutes: " & Text(m.MeetingDate, "mmm d, yyyy"),
                    "<div style='font-family:Segoe UI,Arial,sans-serif;color:#16202C'>" &
                    "<h2 style='color:#0E2240;margin:0 0 4px'>" & m.Title & "</h2>" &
                    "<p style='margin:0 0 16px;color:#5B6470'>" &
                        Text(m.MeetingDate, "dddd, mmmm d, yyyy") & " · " & m.StartTime &
                        If(!IsBlank(m.EndTime), "–" & m.EndTime) &
                        If(!IsBlank(m.Location), " · " & m.Location) &
                    "</p>" &
                    If(
                        CountRows(items) = 0,
                        "<p>No agenda items.</p>",
                        "<table cellpadding='8' style='border-collapse:collapse;width:100%;font-size:14px'>" &
                        "<tr style='background:#0E2240;color:#FFFFFF;text-align:left'>" &
                        "<th>Time</th><th>Item</th><th>Presenter</th><th>Status</th><th>Notes</th></tr>" &
                        Concat(
                            items As a,
                            "<tr style='border-bottom:1px solid #E2E0DB;vertical-align:top'>" &
                            "<td>" &
                                With(
                                    {t: st + Sum(Filter(items, Position < a.Position), Minutes)},
                                    Text(Time(Mod(RoundDown(t / 60, 0), 24), Mod(t, 60), 0), "hh:mm")
                                ) &
                            "</td>" &
                            "<td><b>" & a.Title & "</b>" &
                                If(!IsBlank(a.CarriedFrom), "<br><span style='color:#5B6470'>carried from " & Text(a.CarriedFrom, "mmm d") & "</span>") &
                            "</td>" &
                            "<td>" & If(IsBlank(a.Presenter), "-", a.Presenter) & "</td>" &
                            "<td>" & If(a.Status = "Carried", "Carried to next meeting", a.Status) & "</td>" &
                            "<td>" & Substitute(Substitute(Substitute(a.Notes, "&", "&amp;"), "<", "&lt;"), Char(10), "<br>") & "</td>" &
                            "</tr>"
                        ) &
                        "</table>"
                    ) &
                    "<p style='margin-top:16px;color:#5B6470;font-size:12px'>Sent from the BK117 Team App by " & User().FullName & "</p>" &
                    "</div>"
                );
                Notify("Minutes emailed", NotificationType.Success),
                Notify("The minutes could not be emailed: " & FirstError.Message, NotificationType.Error)
            )
        )
- galMeetings:
    Control: Gallery
    Variant: Vertical
    Properties:
      Items: |-
        =If(
            varShowPast,
            Sort(Filter(Meetings, Status = "Held"), MeetingDate, SortOrder.Descending),
            Sort(Filter(Meetings, Status <> "Held"), MeetingDate, SortOrder.Ascending)
        )
      X: =990
      Y: =492
      Width: =344
      Height: =252
      TemplateSize: =60
      TemplatePadding: =0
      Fill: =Color.Transparent
      TemplateFill: =If(ThisItem.ID = varMeeting.ID, RGBA(251, 227, 212, 1), Color.Transparent)
      OnSelect: =Set(varMeeting, ThisItem); Set(varArmed, Blank())
    Children:
      - lblMDate:
          Control: Label
          Properties:
            OnSelect: =Select(Parent)
            Text: =Text(ThisItem.MeetingDate, "ddd, mmm d, yyyy")
            X: =14
            Y: =6
            Width: =180
            Height: =26
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(22, 32, 44, 1)
      - lblMInfo:
          Control: Label
          Properties:
            OnSelect: =Select(Parent)
            Text: =ThisItem.StartTime & If(!IsBlank(ThisItem.EndTime), "–" & ThisItem.EndTime) & " · " & If(ThisItem.Status = "Held", "Completed", ThisItem.Status)
            X: =14
            Y: =30
            Width: =180
            Height: =24
            Size: =10
            Color: =RGBA(91, 100, 112, 1)
      - ddMAction:
          Control: Classic/DropDown
          Properties:
            Visible: =!(varArmed = "mdel" & ThisItem.ID || varArmed = "mdone" & ThisItem.ID)
            Items: |-
              =If(ThisItem.Status = "Held", ["Actions", "Email minutes", "Reopen"], ["Actions", "Edit meeting", "Mark complete", "Delete meeting"])
            Default: ="Actions"
            X: =200
            Y: =10
            Width: =134
            Height: =40
            Size: =10
            BorderColor: =RGBA(226, 224, 219, 1)
            OnChange: |-
              =Switch(
                  Self.Selected.Value,
                  "Edit meeting",
                      Set(varMeeting, ThisItem);
                      Set(varEditMeeting, true);
                      Navigate(NewMeetingScreen),
                  "Mark complete", Set(varArmed, "mdone" & ThisItem.ID),
                  "Delete meeting", Set(varArmed, "mdel" & ThisItem.ID),
                  "Email minutes",
                      Set(varMailMeeting, ThisItem);
                      Select(btnSendMinutes),
                  "Reopen",
                      Patch(Meetings, ThisItem, {Status: "Upcoming"});
                      If(ThisItem.ID = varMeeting.ID, Set(varMeeting, LookUp(Meetings, ID = ThisItem.ID)));
                      Notify("Meeting reopened. It is now under Upcoming.", NotificationType.Success)
              );
              Reset(Self)
      - btnMConfirm:
          Control: Classic/Button
          Properties:
            Visible: =varArmed = "mdel" & ThisItem.ID || varArmed = "mdone" & ThisItem.ID
            Text: =If(varArmed = "mdel" & ThisItem.ID, "Confirm delete", "Complete")
            X: =196
            Y: =10
            Width: =104
            Height: =40
            Size: =10
            FontWeight: =FontWeight.Bold
            Fill: =If(varArmed = "mdel" & ThisItem.ID, RGBA(179, 38, 30, 1), RGBA(232, 105, 31, 1))
            HoverFill: =If(varArmed = "mdel" & ThisItem.ID, RGBA(150, 30, 25, 1), RGBA(210, 90, 20, 1))
            Color: =Color.White
            HoverColor: =Color.White
            BorderThickness: =0
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: |-
              =If(
                  varArmed = "mdel" & ThisItem.ID,
                  With({m: ThisItem},
                      RemoveIf(AgendaItems, MeetingID = m.ID);
                      Remove(Meetings, m);
                      If(m.ID = varMeeting.ID,
                          If(IsBlank(First(Filter(Meetings, Status = "Upcoming"))),
                              Set(varMeeting, First(Sort(Meetings, MeetingDate, SortOrder.Descending))),
                              Set(varMeeting, First(Sort(Filter(Meetings, Status = "Upcoming"), MeetingDate, SortOrder.Ascending)))
                          )
                      );
                      Notify("Meeting deleted", NotificationType.Success)
                  ),
                  With(
                      {
                          m: ThisItem,
                          nextMeeting: First(Sort(
                              Filter(Meetings, Status = "Upcoming" && MeetingDate > ThisItem.MeetingDate),
                              MeetingDate, SortOrder.Ascending))
                      },
                      With(
                          {
                              openItems: Sort(Filter(AgendaItems, MeetingID = m.ID && Status = "Open"), Position, SortOrder.Ascending),
                              base: CountRows(Filter(AgendaItems, MeetingID = nextMeeting.ID))
                          },
                          If(!IsBlank(nextMeeting) && CountRows(openItems) > 0,
                              ForAll(Sequence(CountRows(openItems)) As n,
                                  With({item: Index(openItems, n.Value)},
                                      Patch(AgendaItems, Defaults(AgendaItems), {
                                          Title: item.Title,
                                          MeetingID: nextMeeting.ID,
                                          Position: base + n.Value,
                                          Presenter: item.Presenter,
                                          Minutes: item.Minutes,
                                          Status: "Open",
                                          CarriedFrom: m.MeetingDate
                                      })
                                  )
                              );
                              ForAll(openItems As o, Patch(AgendaItems, o, {Status: "Carried"}))
                          );
                          Patch(Meetings, m, {Status: "Held"});
                          If(m.ID = varMeeting.ID, Set(varMeeting, LookUp(Meetings, ID = m.ID)));
                          Notify(
                              If(IsBlank(nextMeeting) || CountRows(openItems) = 0,
                                  "Meeting marked complete. Emailing the minutes...",
                                  "Meeting marked complete. " & CountRows(openItems) & " open items moved to " & Text(nextMeeting.MeetingDate, "mmm d") & ". Emailing the minutes..."),
                              NotificationType.Success);
                          Set(varMailMeeting, m);
                          Select(btnSendMinutes)
                      )
                  )
              );
              Set(varArmed, Blank())
      - btnMCancel:
          Control: Classic/Button
          Properties:
            Visible: =varArmed = "mdel" & ThisItem.ID || varArmed = "mdone" & ThisItem.ID
            Text: ="✕"
            X: =304
            Y: =10
            Width: =32
            Height: =40
            Size: =11
            Fill: =Color.White
            HoverFill: =RGBA(243, 242, 239, 1)
            Color: =RGBA(22, 32, 44, 1)
            HoverColor: =RGBA(22, 32, 44, 1)
            BorderColor: =RGBA(22, 32, 44, 1)
            BorderThickness: =1
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: =Set(varArmed, Blank())
# Empty-state pictures and hints for this list: 14-Meetings-EmptyStates.yaml
