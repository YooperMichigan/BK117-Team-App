# BK117 Check Pilots: Meetings screen.
# Paste into MeetingsScreen: select the screen in the Tree view, right-click, Paste code (or Ctrl+V).
# Needs the SharePoint lists CheckPilots, Meetings and AgendaItems connected, and App.OnStart from 1-App-OnStart.txt.
- rectBackground:
    Control: Rectangle
    Properties:
      Fill: =RGBA(243, 242, 239, 1)
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height

# ---------- Sidebar ----------
- rectSidebar:
    Control: Rectangle
    Properties:
      Fill: =RGBA(22, 32, 44, 1)
      X: =0
      Y: =0
      Width: =232
      Height: =Parent.Height
- lblKickerBrand:
