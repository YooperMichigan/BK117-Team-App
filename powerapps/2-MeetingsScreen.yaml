    Children:
      - lblMDate:
          Control: Label
          Properties:
            Text: =Text(ThisItem.MeetingDate, "ddd, mmm d, yyyy")
            X: =14
            Y: =6
            Width: =310
            Height: =26
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(22, 32, 44, 1)
      - lblMInfo:
          Control: Label
          Properties:
            Text: =ThisItem.StartTime & " · " & ThisItem.Status
            X: =14
            Y: =30
            Width: =310
            Height: =24
            Size: =10
            Color: =RGBA(91, 100, 112, 1)
