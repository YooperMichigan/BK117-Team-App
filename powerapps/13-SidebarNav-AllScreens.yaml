# Sidebar nav buttons, one complete set per screen. Delete the old btnNav* buttons on a screen, then paste its block.

# ===== HomeScreen =====
- navHome_Home:
    Control: Classic/Button
    Properties:
      Align: =Align.Left
      BorderThickness: =0
      Color: =Color.White
      Fill: =RGBA(31, 58, 99, 1)
      FontWeight: =FontWeight.Semibold
      Height: =46
      HoverColor: =Color.White
      HoverFill: =RGBA(31, 58, 99, 1)
      OnSelect: =Navigate(HomeScreen)
      PaddingLeft: =14
      PressedFill: =RGBA(31, 58, 99, 1)
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      RadiusTopLeft: =8
      RadiusTopRight: =8
      Size: =13
      Text: ="Home"
      Width: =200
      X: =18
      Y: =120
