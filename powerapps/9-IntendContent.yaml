# BK117 Check Pilots: "I intend to..." content. Needs the SharePoint list Intentions
# (Title, Pilot, TargetDate, Status) connected. Delete lblIntendTitle, rectIntendPanel and
# lblIntendPlaceholder from IntendScreen, then right-click IntendScreen, Paste code.
- rectIHero:
    Control: Rectangle
    Properties:
      Fill: =RGBA(14, 34, 64, 1)
      X: =264
      Y: =24
      Width: =1070
      Height: =120
- lblIHeroKicker:
    Control: Label
    Properties:
      Text: ="TEAM INTENTIONS"
      X: =290
      Y: =36
      Width: =400
      Height: =22
      Size: =10
      FontWeight: =FontWeight.Bold
      Color: =RGBA(240, 160, 112, 1)
- lblIHeroTitle:
    Control: Label
    Properties:
      Text: ="I intend to..."
      X: =290
      Y: =58
      Width: =640
      Height: =36
      Size: =18
      FontWeight: =FontWeight.Bold
      Color: =Color.White
- lblIHeroMeta:
    Control: Label
    Properties:
      Text: =CountRows(Filter(Intentions, Status = "Open")) & " open · " & CountRows(Filter(Intentions, Status = "Done")) & " done"
      X: =290
      Y: =98
      Width: =640
      Height: =28
      Size: =11
      Color: =RGBA(195, 203, 212, 1)
- rectIntendList:
    Control: Rectangle
    Properties:
      Fill: =Color.White
      BorderColor: =RGBA(226, 224, 219, 1)
      BorderThickness: =1
      X: =264
      Y: =168
      Width: =702
      Height: =576
- galIntend:
    Control: Gallery
    Variant: Vertical
    Properties:
      Items: =Sort(Intentions, ID, SortOrder.Descending)
      X: =265
      Y: =169
      Width: =700
      Height: =574
      TemplateSize: =110
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblIStatement:
          Control: Label
          Properties:
            Text: =ThisItem.Title
            X: =24
            Y: =12
            Width: =540
            Height: =44
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =If(ThisItem.Status = "Done", RGBA(91, 100, 112, 1), RGBA(22, 32, 44, 1))
      - lblIMeta:
          Control: Label
          Properties:
            Text: |-
              =If(IsBlank(ThisItem.Pilot), "No name", ThisItem.Pilot) &
              If(!IsBlank(ThisItem.TargetDate), " · by " & Text(ThisItem.TargetDate, "mmm d, yyyy"))
            X: =24
            Y: =64
            Width: =400
            Height: =24
            Size: =10
            Color: =RGBA(91, 100, 112, 1)
      - lblIStatus:
          Control: Label
          Properties:
            Text: =ThisItem.Status
            X: =584
            Y: =14
            Width: =96
            Height: =26
            Size: =9
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =If(ThisItem.Status = "Done", RGBA(220, 239, 226, 1), RGBA(229, 228, 223, 1))
            Color: =If(ThisItem.Status = "Done", RGBA(31, 107, 58, 1), RGBA(91, 100, 112, 1))
      - btnIDone:
          Control: Classic/Button
          Properties:
            Text: =If(ThisItem.Status = "Done", "Reopen", "Mark done")
            X: =440
            Y: =58
            Width: =130
            Height: =40
            Size: =10
            FontWeight: =FontWeight.Bold
            Fill: =If(ThisItem.Status = "Done", Color.White, RGBA(232, 105, 31, 1))
            HoverFill: =If(ThisItem.Status = "Done", RGBA(243, 242, 239, 1), RGBA(210, 90, 20, 1))
            Color: =If(ThisItem.Status = "Done", RGBA(22, 32, 44, 1), Color.White)
            HoverColor: =If(ThisItem.Status = "Done", RGBA(22, 32, 44, 1), Color.White)
            BorderColor: =If(ThisItem.Status = "Done", RGBA(22, 32, 44, 1), RGBA(232, 105, 31, 1))
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: |-
              =Patch(Intentions, ThisItem, {Status: If(ThisItem.Status = "Done", "Open", "Done")})
      - btnIDelete:
          Control: Classic/Button
          Properties:
            Text: =If(varArmed = "idel" & ThisItem.ID, "Tap again", "Delete")
            X: =578
            Y: =58
            Width: =102
            Height: =40
            Size: =10
            FontWeight: =FontWeight.Bold
            Fill: =If(varArmed = "idel" & ThisItem.ID, RGBA(179, 38, 30, 1), Color.White)
            HoverFill: =If(varArmed = "idel" & ThisItem.ID, RGBA(179, 38, 30, 1), RGBA(251, 235, 235, 1))
            Color: =If(varArmed = "idel" & ThisItem.ID, Color.White, RGBA(179, 38, 30, 1))
            HoverColor: =If(varArmed = "idel" & ThisItem.ID, Color.White, RGBA(179, 38, 30, 1))
            BorderColor: =RGBA(179, 38, 30, 1)
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: |-
              =If(
                  varArmed = "idel" & ThisItem.ID,
                  Remove(Intentions, ThisItem); Set(varArmed, Blank()),
                  Set(varArmed, "idel" & ThisItem.ID)
              )
      - sepILine:
          Control: Rectangle
          Properties:
            Fill: =RGBA(226, 224, 219, 1)
            X: =16
            Y: =109
            Width: =668
            Height: =1
- lblIntendHint:
    Control: Label
    Properties:
      Visible: =IsEmpty(Intentions)
      Text: ="Intentions you add appear here, newest first."
      X: =288
      Y: =190
      Width: =650
      Height: =48
      Size: =11
      Color: =RGBA(91, 100, 112, 1)
- rectIAdd:
    Control: Rectangle
    Properties:
      Fill: =Color.White
      BorderColor: =RGBA(226, 224, 219, 1)
      BorderThickness: =1
      X: =990
      Y: =168
      Width: =344
      Height: =400
- lblIAdd:
    Control: Label
    Properties:
      Text: ="Add an intention"
      X: =1010
      Y: =180
      Width: =300
      Height: =30
      Size: =13
      FontWeight: =FontWeight.Bold
      Color: =RGBA(22, 32, 44, 1)
- txtIStatement:
    Control: Classic/TextInput
    Properties:
      Default: =""
      HintText: ="I intend to..."
      Mode: =TextMode.MultiLine
      X: =1010
      Y: =218
      Width: =304
      Height: =100
      Size: =12
      BorderColor: =RGBA(226, 224, 219, 1)
- lblIPilotLabel:
    Control: Label
    Properties:
      Text: ="Who"
      X: =1010
      Y: =328
      Width: =200
      Height: =22
      Size: =10
      FontWeight: =FontWeight.Semibold
      Color: =RGBA(91, 100, 112, 1)
- ddIPilot:
    Control: Classic/DropDown
    Properties:
      Items: =ShowColumns(Sort('Check Pilots', ListOrder, SortOrder.Ascending), Title)
      AllowEmptySelection: =true
      Default: =Blank()
      X: =1010
      Y: =350
      Width: =304
      Height: =44
      Size: =12
      BorderColor: =RGBA(226, 224, 219, 1)
- lblIDateLabel:
    Control: Label
    Properties:
      Text: ="By when"
      X: =1010
      Y: =404
      Width: =200
      Height: =22
      Size: =10
      FontWeight: =FontWeight.Semibold
      Color: =RGBA(91, 100, 112, 1)
- dpITarget:
    Control: Classic/DatePicker
    Properties:
      DefaultDate: =DateAdd(Today(), 30, TimeUnit.Days)
      X: =1010
      Y: =426
      Width: =304
      Height: =44
      Size: =12
      BorderColor: =RGBA(226, 224, 219, 1)
- btnIAdd:
    Control: Classic/Button
    Properties:
      Text: ="Add intention"
      X: =1010
      Y: =496
      Width: =304
      Height: =48
      Size: =13
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(232, 105, 31, 1)
      HoverFill: =RGBA(210, 90, 20, 1)
      Color: =Color.White
      HoverColor: =Color.White
      BorderThickness: =0
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      OnSelect: |-
        =If(
            IsBlank(txtIStatement.Text),
            Notify("Write what you intend to do first.", NotificationType.Warning),
            IfError(
                Patch(Intentions, Defaults(Intentions), {
                    Title: txtIStatement.Text,
                    Pilot: ddIPilot.Selected.Title,
                    TargetDate: dpITarget.SelectedDate,
                    Status: "Open"
                });
                Reset(txtIStatement); Reset(ddIPilot); Reset(dpITarget);
                Notify("Intention added", NotificationType.Success),
                Notify(FirstError.Message, NotificationType.Error)
            )
        )
