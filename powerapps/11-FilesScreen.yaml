      Color: =Color.White
- lblFHeroMeta:
    Control: Label
    Properties:
      Text: |-
        =CountRows(galFiles.AllItems) & " items" &
        If(CountRows(galFiles.AllItems) > 0, " · last change " & Text(Max(galFiles.AllItems, Modified), "mmm d, yyyy"))
      X: =290
      Y: =98
      Width: =640
      Height: =28
      Size: =11
      Color: =RGBA(195, 203, 212, 1)
- rectFilesList:
    Control: Rectangle
    Properties:
      Fill: =Color.White
      BorderColor: =RGBA(226, 224, 219, 1)
      BorderThickness: =1
      X: =264
      Y: =168
      Width: =702
      Height: =576
- galFiles:
    Control: Gallery
    Variant: Vertical
    Properties:
      Items: |-
        =Sort(
            Sort(
                Filter(
                    Documents,
                    'Folder path' = "Shared Documents/BK117 CA Files/",
                    IsBlank(txtFileSearch.Text) || txtFileSearch.Text in 'File name with extension'
                ),
                Modified,
                SortOrder.Descending
            ),
            If(IsFolder, 0, 1),
            SortOrder.Ascending
        )
      X: =265
      Y: =169
      Width: =700
      Height: =574
      TemplateSize: =72
      TemplatePadding: =0
      ShowScrollbar: =true
    Children:
      - lblFType:
          Control: Label
          Properties:
            Text: =If(ThisItem.IsFolder, "FOLDER", Upper(Last(Split(ThisItem.'File name with extension', ".")).Value))
            X: =20
            Y: =22
            Width: =70
            Height: =26
            Size: =8
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =If(ThisItem.IsFolder, RGBA(251, 227, 212, 1), RGBA(229, 228, 223, 1))
            Color: =If(ThisItem.IsFolder, RGBA(180, 72, 15, 1), RGBA(91, 100, 112, 1))
      - lblFName:
          Control: Label
          Properties:
            Text: =ThisItem.'File name with extension'
            X: =104
            Y: =10
            Width: =460
            Height: =28
            Size: =12
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(22, 32, 44, 1)
      - lblFInfo:
          Control: Label
          Properties:
            Text: ="Updated " & Text(ThisItem.Modified, "mmm d, yyyy") & " · " & ThisItem.'Modified By'.DisplayName
            X: =104
            Y: =36
            Width: =460
            Height: =24
            Size: =10
            Color: =RGBA(91, 100, 112, 1)
      - btnFOpen:
          Control: Classic/Button
          Properties:
            Text: ="Open"
            X: =586
            Y: =16
            Width: =94
            Height: =40
            Size: =10
            FontWeight: =FontWeight.Bold
            Fill: =Color.White
            HoverFill: =RGBA(243, 242, 239, 1)
            Color: =RGBA(14, 34, 64, 1)
            HoverColor: =RGBA(14, 34, 64, 1)
            BorderColor: =RGBA(14, 34, 64, 1)
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            OnSelect: =Launch(ThisItem.'Link to item')
      - sepFLine:
          Control: Rectangle
          Properties:
            Fill: =RGBA(226, 224, 219, 1)
            X: =16
            Y: =71
            Width: =668
            Height: =1
