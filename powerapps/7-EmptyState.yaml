# BK117 Check Pilots: "Get started" card shown on MeetingsScreen when there are no meetings.
# Delete lblEmpty from MeetingsScreen first, then right-click MeetingsScreen, Paste code.
- rectEmptyCard:
    Control: Rectangle
    Properties:
      Visible: =IsBlank(varMeeting)
      Fill: =RGBA(22, 32, 44, 1)
      X: =264
      Y: =24
      Width: =702
      Height: =300
- lblEmptyKicker:
    Control: Label
    Properties:
      Visible: =IsBlank(varMeeting)
      Text: ="GET STARTED"
      X: =296
      Y: =48
      Width: =400
      Height: =22
      Size: =10
      FontWeight: =FontWeight.Bold
      Color: =RGBA(240, 160, 112, 1)
- lblEmptyTitle:
    Control: Label
    Properties:
      Visible: =IsBlank(varMeeting)
      Text: ="No meetings scheduled yet"
      X: =296
      Y: =72
      Width: =640
      Height: =40
      Size: =20
      FontWeight: =FontWeight.Bold
      Color: =Color.White
- lblEmptySteps:
    Control: Label
    Properties:
      Visible: =IsBlank(varMeeting)
      Text: |-
        ="1.  Create a meeting with its date, start time and location." & Char(10) &
        "2.  Add agenda items, each with a presenter and minutes. The app works out the clock times." & Char(10) &
        "3.  After the meeting, choose Actions → Mark complete. Open items move to the next meeting."
      X: =296
      Y: =122
      Width: =640
      Height: =100
      Size: =12
      LineHeight: =1.5
      Color: =RGBA(195, 203, 212, 1)
- btnEmptyNew:
    Control: Classic/Button
    Properties:
      Visible: =IsBlank(varMeeting)
      Text: ="+ Create the first meeting"
      X: =296
      Y: =244
      Width: =260
      Height: =48
      Size: =13
      FontWeight: =FontWeight.Bold
      Fill: =RGBA(232, 105, 31, 1)
      HoverFill: =RGBA(210, 90, 20, 1)
      Color: =Color.White
      HoverColor: =Color.White
      BorderThickness: =0
      RadiusTopLeft: =10
      RadiusTopRight: =10
      RadiusBottomLeft: =10
      RadiusBottomRight: =10
      OnSelect: =Set(varEditMeeting, false); Navigate(NewMeetingScreen)
- lblNoMeetingsList:
    Control: Label
    Properties:
      Visible: =CountRows(galMeetings.AllItems) = 0
      Text: ="Meetings you create appear here, newest first."
      X: =1004
      Y: =508
      Width: =316
      Height: =48
      Size: =11
      Color: =RGBA(91, 100, 112, 1)
